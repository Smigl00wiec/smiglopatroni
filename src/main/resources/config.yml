# ---- WARTOSCI BONUSOW (szanse w %, poziomy: 1 = I, 2 = II ...) ----
bonuses:
  freddy:
    patron-hearts: 1.0
    god-hearts: 2.0
  bonnie:
    patron-damage-multiplier: 1.2
    god-strength-level: 1
  chica:
    patron-block-chance: 10.0
    god-weakness-chance: 10.0
    god-weakness-level: 1
    god-weakness-seconds: 5
  foxy:
    patron-speed-level: 1
    god-speed-level: 2
  goldenfreddy:
    patron-lightning-chance: 5.0
    patron-lightning-strikes: 3
    patron-lightning-damage-hearts: 3.5
    patron-lightning-delay-ticks: 10
    god-levitation-chance: 5.0
    god-levitation-level: 1
    god-levitation-seconds: 3
  springtrap:
    patron-health-threshold-hearts: 5.0
    patron-damage-multiplier: 1.3
    patron-speed-level: 3
    god-extra-hit-chance: 5.0
    god-extra-hit-multiplier: 2.0
  marionetka:
    patron-helmet-chance: 5.0
    god-firework-cooldown-seconds: 2.0

messages:
  prefix: "&8[&bPatroni&8] &7"
  player-only: "{prefix}&cTa komenda jest tylko dla graczy."
  no-permission: "{prefix}&cBrak uprawnień."
  rolled: "{prefix}Wylosowałeś patrona: {patron}&7!"
  no-currency: "{prefix}&cAdministrator nie ustawił jeszcze waluty do szybszego losowania."
  not-enough: "{prefix}&cDarmowe losowanie będzie za &e{time}&c. Szybsze kosztuje &f{cost}x {currency}&c."
  god-drawn: "{prefix}&7Wylosowano Boga: {name} &8| &7{desc}"
  draw-busy: "{prefix}&cLosowanie Boga właśnie trwa."
  block-victim: "&e&lZablokowano uderzenie!"
  block-attacker: "&cTwoje uderzenie zostało zablokowane!"
  extra-hit: "&6&lExtra Hit!"
  currency-set: "{prefix}&aUstawiono walutę na trzymany przedmiot."
  currency-hold: "{prefix}&cTrzymaj w ręce przedmiot, który ma być walutą."
  unknown-patron: "{prefix}&cNie ma takiego patrona."
  player-not-found: "{prefix}&cNie znaleziono gracza."
  set-done: "{prefix}&aUstawiono patrona {patron} &adla &f{player}&a."
  reset-done: "{prefix}&aZresetowano czas darmowego losowania dla &f{player}&a."
  reloaded: "{prefix}&aPrzeładowano konfigurację."
  admin-usage: "{prefix}&7/apatroni &fcurrency &8| &fwylosuj [patron] &8| &fset <gracz> <patron|none> &8| &fresetcd <gracz> &8| &freload"
