# ============================================================
#  SmigloPatroni - konfiguracja
#  Kolory: &c, &#RRGGBB oraz MiniMessage, np. <gradient:#FFE600:#FF8A00>tekst</gradient>
#  (nie mieszaj gradientu z kodami & w jednej linii)
#  Wszystkie teksty ZAWSZE w cudzyslowach!
# ============================================================

settings:
  # Identyfikator placeholderow: %smiglo_patron%, %smiglo_god%, %smiglo_god_time%
  identifier: smiglo
  # Placeholdery nieznane temu pluginowi sa przekazywane do tych identyfikatorow.
  # Dzieki temu %smiglo_players% / %smiglo_playersall% dalej dzialaja, jesli w pluginie
  # SmigloPlayers zmienisz identifier na "smigloplayers".
  forward-placeholders:
    - smigloplayers
  # AMPERSAND = zwraca kolory jako &c / &#RRGGBB (dla scoreboardow, ktore same koloruja)
  # SECTION   = zwraca gotowe kolory (§)
  # PLAIN     = bez kolorow
  placeholder-color: AMPERSAND
  placeholder-none: "&7Brak"
  # true = efekty tylko gracz vs gracz
  pvp-only: true

roll:
  free-days: 3
  cost: 48
  # Nazwa waluty pokazywana w lore. Przedmiot waluty ustawiasz komenda /apatroni currency
  currency-name: "<gradient:#FFE600:#FF8A00>Kawałek pizzy</gradient>"

god:
  timezone: "Europe/Warsaw"
  # Losowanie co godzine od 13:30; ostatni bog trwa do 22:30
  start: "13:30"
  end: "22:30"
  interval-minutes: 60
  draw:
    duration-ticks: 60      # 3 sekundy
    step-ticks: 3
    cycle-subtitle: "&7Losowanie Boga..."
    final-subtitle: "{desc}"
  bossbar:
    format: "&8| &fBóg: {name} &8| &f{desc} &8| &6({time})"
    color: YELLOW
    overlay: PROGRESS
    show-when-inactive: false
    inactive-format: "&8| &fBóg: &7brak &8| &fNastępne losowanie za &6({time})"

sounds:   # klucze dzwiekow Minecrafta; puste = brak
  gui-open: "block.chest.open"
  roll: "entity.player.levelup"
  error: "entity.villager.no"
  draw-tick: "block.note_block.hat"
  draw-final: "ui.toast.challenge_complete"
  helmet-break: "entity.item.break"
  block: "item.shield.block"
  extra-hit: "entity.player.attack.crit"

gui:
  title: "&8Patroni"
  glass-blue: BLUE_STAINED_GLASS_PANE
  glass-white: WHITE_STAINED_GLASS_PANE
  campfire-material: CAMPFIRE
  campfire-slots: [3, 5, 48, 50]
  banner-material: BLUE_BANNER
  banner-slots: [4, 49]
  active-lore:
    - "&7"
    - "&a✔ &fTo jest Twój aktualny patron"
  dice:
    slot: 12
    name: "&b&lʟᴏꜱᴏᴡᴀɴɪᴇ ᴘᴀᴛʀᴏɴᴀ"
    head:
      owner: ""      # nick gracza, z ktorego ma byc glowka
      texture: ""    # LUB wartosc "Value" (base64) z minecraft-heads.com - ma pierwszenstwo
    lore:
      - "&8x &7Patrona możesz za darmo losować co &6{days} dni"
      - "&8x &7Koszt szybszego wylosowania &f{cost} {currency}"
      - "&7"
      - "&8x &7Darmowe losowanie: {free-status}"
      - "&7"
      - "&aKliknij &fPPM &aaby wylosować!"
    status-active: "&aAKTYWNE"
    status-inactive: "&cNIE AKTYWNE &8(&7{time}&8)"
  info:
    slot: 14
    material: BIRCH_SIGN
    name: "&b✱ &3&lINFORMACJE &b✱"
    lore:
      - "&8x &7Twój Patron: &f{patron}"
      - "&8x &7Darmowe losowanie za: &e{free-time}"
      - "&7"
      - "&8x &7Co godzinę od &f{start} &7do &f{end} &7losowany jest &6Bóg&7."
      - "&8x &7Jego bonus (&fGodzina Patrona&7) dostają &fwszyscy gracze&7."
      - "&8x &7Bonus &fDla Patronów &7dostaje tylko gracz z danym patronem."
      - "&7"
      - "&8x &7Aktualny Bóg: &f{god}"
      - "&8x &7Do końca: &6{god-time}"

